services:
  game:
    build:
      context: ..
    restart: unless-stopped
    environment:
      APP_ORIGIN: https://${GAME_DOMAIN:?Set GAME_DOMAIN to your public domain}
      TRUST_PROXY: "1"
      MAX_ROOMS: "64"
    volumes:
      - rooms:/app/data
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      GAME_DOMAIN: ${GAME_DOMAIN:?Set GAME_DOMAIN to your public domain}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - proxy-config:/config
    depends_on:
      - game
volumes:
  rooms:
  certificates:
  proxy-config:
